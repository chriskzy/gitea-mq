name: Build Docker Image
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the prepared image to GHCR
        type: boolean
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,format=short
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.thalheim.io
            extra-trusted-public-keys = cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc=
      - name: Resolve image derivation
        id: image
        run: |
          drv=$(nix eval --raw .#gitea-mq-docker.drvPath)
          echo "key=oci-archive-v1-${drv##*/}" >> "$GITHUB_OUTPUT"
      - name: Cache the unlabelled image archive
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/gitea-mq-image.tar
          key: ${{ steps.image.outputs.key }}
      - name: Build Docker image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix build .#gitea-mq-docker --print-build-logs
          cp result "$RUNNER_TEMP/gitea-mq-image.tar"
      - name: Prepare image for publishing
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          regctl_bin="$(nix build --inputs-from . nixpkgs#regctl --print-out-paths --no-link)/bin"
          echo "$regctl_bin" >> "$GITHUB_PATH"
          export PATH="$regctl_bin:$PATH"

          image=ocidir://local:gitea-mq
          regctl image import "$image" "$RUNNER_TEMP/gitea-mq-image.tar"
          label_args=()
          while IFS= read -r label; do
            if [ -n "$label" ]; then label_args+=(--label "$label"); fi
          done <<< "$LABELS"
          regctl image mod "$image" --replace "${label_args[@]}"

          for platform in linux/amd64 linux/arm64; do
            revision=$(regctl image inspect "$image" --platform "$platform" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$revision" != "$GITHUB_SHA" ]; then
              echo "::error::$platform image revision '$revision' differs from the checkout '$GITHUB_SHA'"
              exit 1
            fi
            echo "$platform image revision $revision"
          done
      - name: Push images
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          REGCTL_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          regctl registry login "$REGISTRY" -u "$GITHUB_ACTOR" --pass-stdin <<< "$REGCTL_PASSWORD"
          while IFS= read -r tag; do
            regctl image copy "ocidir://local:gitea-mq" "$tag"
          done <<< "$TAGS"
  cross:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.thalheim.io
            extra-trusted-public-keys = cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc=
      - name: Cross-build both images on one runner
        run: nix build .#gitea-mq-docker --print-build-logs
  native:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.thalheim.io
            extra-trusted-public-keys = cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc=
      - name: Build the native platform image
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          nix build ".#gitea-mq-docker.platforms.$NIX_SYSTEM" --print-build-logs
          cp result "$RUNNER_TEMP/$NIX_SYSTEM.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.system }}
          path: ${{ runner.temp }}/${{ matrix.system }}.tar
          retention-days: 1
          if-no-files-found: error
  assemble:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Assemble and verify both native image manifests
        run: |
          tool="$(nix build --inputs-from . nixpkgs#regctl --print-out-paths --no-link)/bin/regctl"
          "$tool" image import ocidir://native:amd64 x86_64-linux.tar
          "$tool" image import ocidir://native:arm64 aarch64-linux.tar
          "$tool" index create ocidir://native:latest --ref ocidir://native:amd64 --ref ocidir://native:arm64
          "$tool" image export ocidir://native:latest --name gitea-mq:latest > combined.tar
          for platform in linux/amd64 linux/arm64; do
            "$tool" image inspect ocidir://native:latest --platform "$platform" --format '{{.OS}}/{{.Architecture}} {{json .Config.Entrypoint}}'
          done
